  <head>
    <meta charset="UTF-8" />

    <meta

    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta property="og:title" content="Sergey Stepanenko — проекты" />
    <meta
      property="og:description"
      content="React-приложения, Telegram Mini Apps, AI-автоматизация и браузерные агенты. Исходный код, тесты и понятный запуск."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ставим тему до первой отрисовки, иначе на светлой теме мигнёт тёмный кадр.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var fromQuery = params.get('theme');
          var mode =
            fromQuery === 'light' || fromQuery === 'dark'
              ? fromQuery
              : window.localStorage.getItem('st.theme') === 'light'
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'dark' ? '#0b0b0d' : '#f7f7f8');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
